<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>

  <div class="container">

    <!-- Greeting Section -->
    <section class="card greeting-card">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date"></div>
      <div id="greeting" class="greeting"></div>
      <div class="name-row">
        <span id="displayName" class="display-name"></span>
        <button class="btn-icon" id="editNameBtn" title="Edit name">✏️</button>
      </div>
      <div class="name-edit hidden" id="nameEditForm">
        <input type="text" id="nameInput" placeholder="Enter your name…" maxlength="40" />
        <button class="btn btn-primary" id="saveNameBtn">Save</button>
      </div>
    </section>

    <div class="grid-two">

      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-duration-row">
          <label for="timerMinutes">Duration (min):</label>
          <input type="number" id="timerMinutes" min="1" max="90" value="25" />
          <button class="btn btn-secondary" id="applyDurationBtn">Apply</button>
        </div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-secondary" id="stopBtn">Stop</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="card todo-card">
        <h2>Tasks</h2>
        <div class="todo-input-row">
          <input type="text" id="taskInput" placeholder="Add a new task…" maxlength="100" />
          <button class="btn btn-primary" id="addTaskBtn">Add</button>
        </div>
        <div class="todo-controls">
          <button class="btn btn-ghost btn-sm" id="sortTasksBtn">⇅ Sort</button>
        </div>
        <ul class="task-list" id="taskList"></ul>
      </section>

    </div>

    <!-- Quick Links -->
    <section class="card links-card">
      <h2>Quick Links</h2>
      <div class="links-input-row">
        <input type="text" id="linkName" placeholder="Link name" maxlength="30" />
        <input type="url" id="linkUrl" placeholder="https://…" />
        <button class="btn btn-primary" id="addLinkBtn">Add Link</button>
      </div>
      <div class="links-list" id="linksList"></div>
    </section>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
